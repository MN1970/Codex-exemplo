name: Code Review with Opus

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/agents/**"
      - "src/services/**"
      - "src/config/**"

jobs:
  code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Get PR diff
        id: pr-diff
        run: |
          git fetch origin main:main
          git diff main...HEAD > /tmp/pr.diff
          cat /tmp/pr.diff

      - name: Run Code Review
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm run build
          npx ts-node \
            --project tsconfig.json \
            src/agents/code-review-ci.ts

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/review-report.json', 'utf-8');
            const reviewData = JSON.parse(report);

            let comment = `## 🤖 Code Review by Opus\n\n`;
            comment += `**Score: ${reviewData.overallScore}/100**\n`;
            comment += `**Status: ${reviewData.suggestedAction.toUpperCase()}**\n\n`;

            if (reviewData.findings.length === 0) {
              comment += `✨ No issues found!\n`;
            } else {
              comment += `### Findings (${reviewData.findings.length} total)\n\n`;

              const bySeverity = {
                critical: [],
                error: [],
                warning: [],
                info: []
              };

              for (const finding of reviewData.findings) {
                bySeverity[finding.severity].push(finding);
              }

              for (const [severity, items] of Object.entries(bySeverity)) {
                if (items.length === 0) continue;
                const emoji = {critical: '🔴', error: '🟠', warning: '🟡', info: 'ℹ️'};
                comment += `#### ${emoji[severity]} ${severity.toUpperCase()} (${items.length})\n`;
                for (const item of items.slice(0, 3)) {
                  comment += `- **${item.title}** (\`${item.file}:${item.line}\`)\n`;
                  comment += `  ${item.description}\n`;
                  if (item.suggestion) {
                    comment += `  💡 ${item.suggestion}\n`;
                  }
                }
                if (items.length > 3) {
                  comment += `- ... +${items.length - 3} more\n`;
                }
              }
            }

            comment += `\n---\n*Analysis time: ${reviewData.analysisTimeMs}ms*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail if critical issues
        if: failure() || steps.review.outputs.has-critical == 'true'
        run: |
          echo "❌ Code review found critical issues"
          exit 1
