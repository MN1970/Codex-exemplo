name: Sync Agents to SharePoint

on:
  push:
    branches:
      - main
      - claude/**
    paths:
      - '.claude/agents/**'
      - 'docs/PHASE-2-ROADMAP.md'
      - 'docs/MAESTRO-EVOLUTION-SUMMARY.md'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync mode'
        required: true
        default: 'changed'
        type: choice
        options:
          - changed
          - all

jobs:
  sync-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SHAREPOINT_SITE_ID: ${{ secrets.SHAREPOINT_SITE_ID }}
      SHAREPOINT_DRIVE_ID: ${{ secrets.SHAREPOINT_DRIVE_ID }}
      MICROSOFT_GRAPH_TOKEN: ${{ secrets.MICROSOFT_GRAPH_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 10  # For git diff

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check SharePoint credentials
        id: check_creds
        run: |
          if [ -z "$SHAREPOINT_SITE_ID" ] || [ -z "$SHAREPOINT_DRIVE_ID" ] || [ -z "$MICROSOFT_GRAPH_TOKEN" ]; then
            echo "❌ Missing SharePoint credentials"
            echo "Configure in GitHub Settings → Secrets and variables → Actions:"
            echo "  - SHAREPOINT_SITE_ID"
            echo "  - SHAREPOINT_DRIVE_ID"
            echo "  - MICROSOFT_GRAPH_TOKEN"
            echo "creds_available=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Credentials available"
            echo "creds_available=true" >> $GITHUB_OUTPUT
          fi

      - name: Sync agents (dry-run)
        if: steps.check_creds.outputs.creds_available == 'false'
        run: |
          echo "🔍 [DRY RUN] Simulating agent sync..."
          python scripts/sync_agents_to_sharepoint.py --all --dry-run

      - name: Sync changed agents
        if: |
          steps.check_creds.outputs.creds_available == 'true' &&
          github.event_name == 'push'
        id: sync_changed
        run: |
          echo "🚀 Syncing changed agents..."
          python scripts/sync_agents_to_sharepoint.py --changed
          echo "status=completed" >> $GITHUB_OUTPUT

      - name: Sync all agents (manual trigger)
        if: |
          steps.check_creds.outputs.creds_available == 'true' &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.mode == 'all'
        id: sync_all
        run: |
          echo "🚀 Syncing all agents..."
          python scripts/sync_agents_to_sharepoint.py --all
          echo "status=completed" >> $GITHUB_OUTPUT

      - name: Post sync results
        if: always()
        run: |
          if [ "${{ steps.sync_changed.outputs.status }}" == "completed" ] || [ "${{ steps.sync_all.outputs.status }}" == "completed" ]; then
            echo "✅ Agent sync completed successfully"
          elif [ "${{ steps.check_creds.outputs.creds_available }}" == "false" ]; then
            echo "⚠️  Sync skipped — credentials not configured"
            echo "To enable automatic SharePoint sync, configure secrets in GitHub Settings"
          else
            echo "⊘ No agents to sync"
          fi

      - name: Comment on PR
        if: |
          github.event_name == 'push' &&
          github.ref_name != 'main'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Get list of changed agent files
            const agents = [
              'agente-portos.md',
              'agente-aeroportos.md',
              'agente-saneamento.md',
              'agente-energia.md',
              'agente-barragens.md'
            ];

            const changedAgents = agents.filter(agent => {
              const filePath = `.claude/agents/${agent}`;
              try {
                return fs.existsSync(filePath);
              } catch {
                return false;
              }
            });

            if (changedAgents.length > 0) {
              const comment = `## 📄 Agent Files Ready for SharePoint Sync

The following agent files are ready to sync to SharePoint:
${changedAgents.map(a => `- **${a}** → \`04_IA/Manta-Maestro/01-agentes-fundamentais/${a.replace('.md', '')}/SKILL.md\``).join('\n')}

**Status:**
- ${{ steps.check_creds.outputs.creds_available == 'true' && '✅ Credentials configured — will auto-sync on merge' || '⚠️  Credentials not configured — configure in Settings → Secrets' }}

**Manual sync:**
\`\`\`bash
python scripts/sync_agents_to_sharepoint.py --changed
\`\`\`

---
_Generated by [Claude Code](https://claude.ai/code)_`;

              // For push to non-main branches, we can't comment on PR without PR context
              // This would need to be a separate action triggered by PR events
              console.log(comment);
            }

      - name: Generate summary
        if: always()
        run: |
          echo "## 🔄 SharePoint Agent Sync" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Status" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_creds.outputs.creds_available }}" == "true" ]; then
            echo "✅ SharePoint credentials available" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️  SharePoint credentials NOT configured" >> $GITHUB_STEP_SUMMARY
            echo "Configure in Settings → Secrets → Actions:" >> $GITHUB_STEP_SUMMARY
            echo "- \`SHAREPOINT_SITE_ID\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`SHAREPOINT_DRIVE_ID\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`MICROSOFT_GRAPH_TOKEN\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Agents" >> $GITHUB_STEP_SUMMARY
          echo "| Agent | Destination |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| agente-portos.md | 04_IA/.../agente-portos/SKILL.md |" >> $GITHUB_STEP_SUMMARY
          echo "| agente-aeroportos.md | 04_IA/.../agente-aeroportos/SKILL.md |" >> $GITHUB_STEP_SUMMARY
          echo "| agente-saneamento.md | 04_IA/.../agente-saneamento/SKILL.md |" >> $GITHUB_STEP_SUMMARY
          echo "| agente-energia.md | 04_IA/.../agente-energia/SKILL.md |" >> $GITHUB_STEP_SUMMARY
          echo "| agente-barragens.md | 04_IA/.../agente-barragens/SKILL.md |" >> $GITHUB_STEP_SUMMARY
