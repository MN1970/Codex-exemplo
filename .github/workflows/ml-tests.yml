name: ML Tests (manta-backend)

# Testing + evaluation da pipeline de ML do Manta Maestro:
#   - ml/embeddings.py   (tests/test_embeddings.py)      — shape + cosine similarity
#   - ml/routing.py      (tests/test_routing.py,
#                          tests/test_routing_ml.py)       — routing accuracy (24 prompts, >=95%)
#   - ml/lora_finetuner.py (tests/test_finetuning.py)      — treino roda sem erros, loss diminui
#
# Roda 100% offline (encoder "hashing" em ml/routing.py, modelo
# GPT-2 minúsculo + tokenizer BPE local em ml/lora_finetuner.py) — não
# depende de rede/GPU/download de pesos do Hugging Face Hub, então não
# precisa de nenhum secret nem serviço externo neste workflow.
#
# `tests/test_connection.py` (na raiz de manta-backend/, fora de
# tests/) exige Postgres real e fica FORA do escopo deste workflow —
# ver sua própria suíte/infra (docker-compose.yml).

on:
  pull_request:
    branches: [main]
    paths:
      - "manta-backend/ml/**"
      - "manta-backend/data/**"
      - "manta-backend/tests/**"
      - "manta-backend/pyproject.toml"
      - "manta-backend/requirements.txt"
      - "manta-backend/requirements-dev.txt"
      - ".github/workflows/ml-tests.yml"
  push:
    branches: [main]
    paths:
      - "manta-backend/ml/**"
      - "manta-backend/data/**"
      - "manta-backend/tests/**"
      - "manta-backend/pyproject.toml"
      - "manta-backend/requirements.txt"
      - "manta-backend/requirements-dev.txt"
      - ".github/workflows/ml-tests.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ml-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: manta-backend

jobs:
  pytest-coverage:
    name: "pytest + coverage (ml.embeddings / ml.routing / ml.lora_finetuner)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "manta-backend/requirements-dev.txt"

      - name: Instalar dependências (requirements-dev.txt)
        run: pip install -r requirements-dev.txt

      - name: Rodar pytest (tests/) com coverage
        run: |
          python -m pytest tests/ \
            --cov=ml.embeddings --cov=ml.routing --cov=ml.lora_finetuner \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-fail-under=80 \
            -v

      - name: Upload coverage report (XML + HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-coverage-report
          path: |
            manta-backend/coverage.xml
            manta-backend/htmlcov/
          retention-days: 30

      - name: Resumo no job summary
        if: always()
        run: |
          echo "### ML Tests — coverage (ml.embeddings / ml.routing / ml.lora_finetuner)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
