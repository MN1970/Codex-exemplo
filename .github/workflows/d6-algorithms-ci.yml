name: D6 Seismic Geotechnical Algorithms CI/CD

on:
  push:
    branches: [ main, develop, feature/** ]
    paths:
      - 'docs/s1-seismic-v2/FASE-C-OUTPUTS/algorithms/**'
      - '.github/workflows/d6-algorithms-ci.yml'
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'  # Nightly test run at 2 AM UTC

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for versioning

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-benchmark pytest-timeout numpy scipy

    - name: Run unit tests
      run: |
        cd docs/s1-seismic-v2/FASE-C-OUTPUTS/algorithms
        pytest test_d6_algorithms.py -v \
          --tb=short \
          --timeout=10 \
          --junit-xml=test-results.xml
      timeout-minutes: 5

    - name: Run coverage analysis
      run: |
        cd docs/s1-seismic-v2/FASE-C-OUTPUTS/algorithms
        pytest test_d6_algorithms.py \
          --cov=seismic_geotechnical_d6_algorithms \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Run integrated tests (Jericó case study)
      run: |
        cd docs/s1-seismic-v2/FASE-C-OUTPUTS/algorithms
        pytest test_d6_algorithms.py::TestIntegration::test_jerico_complete_workflow \
          -v --tb=short

    - name: Report test summary
      if: always()
      run: |
        echo "Test execution completed for Python ${{ matrix.python-version }}"
        if [ -f test-results.xml ]; then
          echo "Test results file generated: test-results.xml"
        fi

  performance:
    name: Performance & Stress Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-benchmark numpy scipy

    - name: Run performance tests
      run: |
        cd docs/s1-seismic-v2/FASE-C-OUTPUTS/algorithms
        pytest test_d6_algorithms.py::TestPerformance -v \
          --tb=short \
          --timeout=30

  lint:
    name: Code Quality (Black, isort, Pylint)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install linters
      run: |
        pip install black isort pylint

    - name: Check code formatting (Black)
      run: black --check docs/s1-seismic-v2/FASE-C-OUTPUTS/algorithms/seismic_geotechnical_d6_algorithms.py docs/s1-seismic-v2/FASE-C-OUTPUTS/algorithms/test_d6_algorithms.py
      continue-on-error: true

    - name: Check import sorting (isort)
      run: isort --check-only docs/s1-seismic-v2/FASE-C-OUTPUTS/algorithms/seismic_geotechnical_d6_algorithms.py docs/s1-seismic-v2/FASE-C-OUTPUTS/algorithms/test_d6_algorithms.py
      continue-on-error: true

    - name: Run pylint analysis
      run: |
        pylint docs/s1-seismic-v2/FASE-C-OUTPUTS/algorithms/seismic_geotechnical_d6_algorithms.py \
          --fail-under=8.0 \
          --output-format=colorized \
          || true

  security:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install security tools
      run: |
        pip install bandit safety

    - name: Run Bandit security scan
      run: |
        bandit -r docs/s1-seismic-v2/FASE-C-OUTPUTS/algorithms/seismic_geotechnical_d6_algorithms.py \
          -f json -o bandit-report.json \
          || true

    - name: Check dependencies (Safety)
      run: |
        pip install -r docs/s1-seismic-v2/FASE-C-OUTPUTS/algorithms/requirements.txt 2>/dev/null || true
        safety check || true

  documentation:
    name: Documentation Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Sphinx
      run: |
        pip install sphinx sphinx-rtd-theme sphinx-autodoc-typehints

    - name: Build API documentation
      run: |
        sphinx-apidoc -o docs seismic_geotechnical_d6_algorithms.py || true
        mkdir -p docs && cd docs && sphinx-build -b html . _build/html || true
      continue-on-error: true

  deploy-test:
    name: Deploy to Test Environment
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    if: github.ref == 'refs/heads/develop'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Prepare test deployment package
      run: |
        mkdir -p deployment/algorithms
        cp docs/s1-seismic-v2/FASE-C-OUTPUTS/algorithms/seismic_geotechnical_d6_algorithms.py deployment/algorithms/
        cp docs/s1-seismic-v2/FASE-C-OUTPUTS/algorithms/test_d6_algorithms.py deployment/algorithms/
        cat > deployment/MANIFEST.txt << 'EOF'
        D6.2-D6.5 Seismic Geotechnical Algorithms
        Deployment Package

        Contents:
          - seismic_geotechnical_d6_algorithms.py: Core production modules
          - test_d6_algorithms.py: Comprehensive test suite

        Installation:
          pip install numpy
          python seismic_geotechnical_d6_algorithms.py  # Runs self-tests

        Usage:
          pytest test_d6_algorithms.py -v
        EOF

    - name: Verify deployment package
      run: |
        echo "Deployment package prepared:"
        ls -lah deployment/
        echo "Package contents verified"

    - name: Upload to test artifact repository
      uses: actions/upload-artifact@v3
      with:
        name: d6-algorithms-test-pkg-${{ github.sha }}
        path: deployment/
        retention-days: 30

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [test, performance]
    if: always()

    steps:
    - name: Report CI Status
      run: |
        if [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.performance.result }}" == "success" ]; then
          echo "✓ D6.2-D6.5 Algorithms: CI/CD PASSED"
          echo "- All unit tests passing"
          echo "- Performance benchmarks acceptable"
          echo "- Ready for integration"
          exit 0
        else
          echo "✗ D6.2-D6.5 Algorithms: CI/CD FAILED"
          exit 1
        fi
