name: Deploy Maestro — Build, Test, Deploy

# Reference implementation used by docs/TRAINING-GUIDE-DEVOPS-DATA-TEAMS.md
# Stages: trigger -> build -> test -> deploy (canary) -> promote

on:
  push:
    branches: [main]
    paths:
      - 'manta-hub/**'
      - 'supabase/migrations/**'
      - 'infra/**'
      - '.github/workflows/deploy-maestro.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]
      skip_canary:
        description: 'Skip canary stage and go straight to full rollout'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-maestro-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false   # never cancel an in-flight deploy

env:
  IMAGE_NAME: manta-maestro
  REGISTRY: ${{ vars.CONTAINER_REGISTRY || 'us-docker.pkg.dev/manta-prod/maestro' }}
  GCP_REGION: southamerica-east1

jobs:
  # ---------------------------------------------------------------------
  # 1. BUILD — compile container image, tag with SHA + environment
  # ---------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: manta-hub/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------
  # 2. TEST — routing suite + migration dry-run + advisors check
  # ---------------------------------------------------------------------
  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL_STAGING }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_STAGING }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_STAGING }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pypdf anthropic supabase python-dotenv pytest

      - name: Run routing test suite
        run: python scripts/test_routing.py --suite tests/comprehensive-test-suite.json

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to staging project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF_STAGING }}"

      - name: Migration dry-run (no changes applied)
        run: supabase db push --dry-run

      - name: Post-migration advisors check (staging mirror)
        run: |
          echo "Advisors check runs via mcp__Supabase__get_advisors in an interactive session."
          echo "CI gate: fail the job if supabase db lint reports errors."
          supabase db lint || { echo "::error::Lint found issues — fix before deploy"; exit 1; }

  # ---------------------------------------------------------------------
  # 3. DEPLOY — apply migrations, then roll out the image (canary first)
  # ---------------------------------------------------------------------
  deploy-migrations:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to target project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Apply pending migrations (idempotent, transactional)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db push
          echo "Migrations applied. Verifying critical tables exist..."
          supabase db query "SELECT to_regclass('public.rag_chunks'), to_regclass('public.maestro_runtime_metrics'), to_regclass('public.maestro_user_feedback');"

  deploy-canary:
    needs: [build, deploy-migrations]
    if: ${{ github.event.inputs.skip_canary != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy 10% canary to Cloud Run
        run: |
          gcloud run deploy maestro-router \
            --image "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}" \
            --region ${{ env.GCP_REGION }} \
            --no-traffic \
            --tag canary \
            --revision-suffix "canary-${{ needs.build.outputs.image_tag }}"

          gcloud run services update-traffic maestro-router \
            --region ${{ env.GCP_REGION }} \
            --to-tags canary=10

      - name: Watch canary error rate for 5 minutes
        run: |
          echo "Poll Cloud Monitoring / maestro_runtime_metrics fallback_rate for the canary revision."
          echo "Abort (see rollback runbook, docs/TRAINING-GUIDE-DEVOPS-DATA-TEAMS.md §1.3) if error rate > 2%."
          sleep 300

  promote:
    needs: [build, deploy-canary]
    if: ${{ always() && needs.build.result == 'success' && (needs.deploy-canary.result == 'success' || needs.deploy-canary.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Promote canary to 100%
        run: |
          gcloud run services update-traffic maestro-router \
            --region ${{ env.GCP_REGION }} \
            --to-latest

      - name: Summary
        run: |
          echo "## Deploy complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: ${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: ${{ github.event.inputs.environment || 'staging' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rollback: gcloud run services update-traffic maestro-router --to-revisions PREVIOUS_REVISION=100" >> "$GITHUB_STEP_SUMMARY"
