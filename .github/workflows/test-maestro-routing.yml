name: Maestro Routing Tests

on:
  push:
    branches:
      - main
      - claude/**
    paths:
      - 'CLAUDE.md'
      - '.claude/agents/**'
      - 'tests/routing/**'
      - '.github/workflows/test-maestro-routing.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'CLAUDE.md'
      - '.claude/agents/**'
      - 'tests/routing/**'
  workflow_dispatch:

jobs:
  routing-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic python-dotenv supabase pydantic

      - name: Run routing tests
        id: test
        run: |
          python scripts/test_routing.py tests/routing/prompts.md --format json --output /tmp/test_results.json
          cat /tmp/test_results.json

      - name: Parse test results
        id: parse
        run: |
          python - <<'EOF'
          import json
          import sys
          import os

          with open('/tmp/test_results.json', 'r') as f:
              results = json.load(f)

          total = len(results['tests'])
          passed = sum(1 for t in results['tests'] if t['status'] == 'passed')
          failed = total - passed

          accuracy = (passed / total * 100) if total > 0 else 0
          median_latency = results['metrics']['latency_median_ms']

          print(f"TOTAL={total}")
          print(f"PASSED={passed}")
          print(f"FAILED={failed}")
          print(f"ACCURACY={accuracy:.1f}%")
          print(f"LATENCY_MEDIAN={median_latency:.0f}ms")

          # Set job outputs
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"accuracy={accuracy:.1f}\n")
              f.write(f"latency_median={median_latency:.0f}\n")
              f.write(f"passed={passed}\n")
              f.write(f"failed={failed}\n")
              f.write(f"total={total}\n")
          EOF

      - name: Check accuracy threshold
        run: |
          accuracy=${{ steps.parse.outputs.accuracy }}
          if (( $(echo "$accuracy < 90" | bc -l) )); then
            echo "❌ Accuracy $accuracy% below 90% threshold"
            exit 1
          fi
          echo "✅ Accuracy $accuracy% >= 90%"

      - name: Check latency threshold
        run: |
          latency=${{ steps.parse.outputs.latency_median }}
          if (( $(echo "$latency > 500" | bc -l) )); then
            echo "⚠️  Median latency ${latency}ms exceeds 500ms target (acceptable for now)"
          else
            echo "✅ Median latency ${latency}ms within 500ms target"
          fi

      - name: Upload results to Supabase
        if: always()
        run: |
          python - <<'EOF'
          import os
          import json
          from datetime import datetime
          from supabase import create_client, Client

          url = os.environ.get('SUPABASE_URL')
          key = os.environ.get('SUPABASE_ANON_KEY')

          if not url or not key:
              print("⚠️  Skipping Supabase upload — credentials not configured")
              exit(0)

          supabase: Client = create_client(url, key)

          with open('/tmp/test_results.json', 'r') as f:
              results = json.load(f)

          run_id = os.environ.get('GITHUB_RUN_ID', 'local')

          for test in results['tests']:
              data = {
                  'run_id': run_id,
                  'timestamp': datetime.utcnow().isoformat(),
                  'prompt': test['prompt'],
                  'expected_agent': test['expected_agent'],
                  'routed_agent': test['routed_agent'],
                  'score': test['score'],
                  'latency_ms': test['latency_ms'],
                  'status': test['status'],
              }

              try:
                  supabase.table('maestro_test_results').insert(data).execute()
              except Exception as e:
                  print(f"⚠️  Failed to insert result for '{test['prompt'][:50]}': {e}")

          print("✅ Results uploaded to Supabase")
          EOF

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const accuracy = '${{ steps.parse.outputs.accuracy }}';
            const latency = '${{ steps.parse.outputs.latency_median }}';
            const passed = '${{ steps.parse.outputs.passed }}';
            const total = '${{ steps.parse.outputs.total }}';

            const comment = `## 🧪 Maestro Routing Test Results

            | Metric | Value |
            |--------|-------|
            | **Accuracy** | ${accuracy}% (target: ≥90%) |
            | **Tests Passed** | ${passed}/${total} |
            | **Median Latency** | ${latency}ms (target: <500ms) |

            ${accuracy >= 90 ? '✅ **PASS**: Routing accuracy meets threshold' : '❌ **FAIL**: Accuracy below 90%'}

            ---
            _Generated by [Claude Code](https://claude.ai/code)_`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Generate summary
        if: always()
        run: |
          echo "## Maestro Routing Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total Tests | ${{ steps.parse.outputs.total }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Passed | ${{ steps.parse.outputs.passed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed | ${{ steps.parse.outputs.failed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Accuracy | ${{ steps.parse.outputs.accuracy }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| Median Latency | ${{ steps.parse.outputs.latency_median }}ms |" >> $GITHUB_STEP_SUMMARY
