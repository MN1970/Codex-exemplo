[tool.poetry]
name = "manta-backend"
version = "0.1.0"
description = "Backend FastAPI async do Manta Maestro (Agent Registry) — Manta Associados"
authors = ["Manta Associados"]
readme = "README.md"
packages = [
    { include = "app.py" },
    { include = "config.py" },
    { include = "database.py" },
    { include = "pg_pool.py" },
    { include = "db.py" },
    { include = "models.py" },
    { include = "auth.py" },
    { include = "routers" },
    { include = "mcp" },
    { include = "ml" },
    { include = "alembic" },
]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
asyncpg = "^0.29.0"
aiohttp = "^3.10.0"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
bcrypt = "4.0.1"  # pin: bcrypt>=4.1 quebra o probe de versão de passlib==1.7.4
python-multipart = "^0.0.12"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.35" }
email-validator = "^2.2.0"
pgvector = "^0.5.0"    # tipo Vector do SQLAlchemy — database.py (RagChunk.embedding)
alembic = "^1.18.0"    # migrations versionadas — alembic/versions/

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.0"
ruff = "^0.6.0"
aiosqlite = "^0.20.0"
greenlet = "^3.1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
