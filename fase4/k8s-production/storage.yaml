apiVersion: v1
kind: PersistentVolume
metadata:
  name: ml-model-pv
  labels:
    type: local
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard
  local:
    path: /mnt/ml-models
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: ml-node
          operator: In
          values:
          - "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ml-model-pvc
  namespace: manta-fase4-prod
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: standard
  selector:
    matchLabels:
      type: local
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: prometheus-pv
  labels:
    type: local
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard
  local:
    path: /mnt/prometheus
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: monitoring-node
          operator: In
          values:
          - "true"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: elasticsearch-data-pv
  labels:
    type: local
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard
  local:
    path: /mnt/elasticsearch
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: observability-node
          operator: In
          values:
          - "true"
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fase4-fast
provisioner: kubernetes.io/host-path
parameters:
  type: pd-ssd
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fase4-standard
provisioner: kubernetes.io/host-path
parameters:
  type: pd-standard
volumeBindingMode: WaitForFirstConsumer
