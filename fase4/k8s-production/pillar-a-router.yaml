apiVersion: v1
kind: ConfigMap
metadata:
  name: router-config
  namespace: manta-fase4-prod
data:
  router-config.json: |
    {
      "platforms": {
        "github": {
          "api_version": "2022-11-28",
          "rate_limit": 5000,
          "timeout_ms": 30000,
          "retry_policy": "exponential_backoff"
        },
        "gitlab": {
          "api_version": "v4",
          "rate_limit": 600,
          "timeout_ms": 30000,
          "retry_policy": "exponential_backoff"
        },
        "bitbucket": {
          "api_version": "2.0",
          "rate_limit": 1000,
          "timeout_ms": 30000,
          "retry_policy": "exponential_backoff"
        },
        "gitea": {
          "api_version": "v1",
          "rate_limit": 10000,
          "timeout_ms": 30000,
          "retry_policy": "exponential_backoff"
        }
      },
      "routing_rules": {
        "merge_webhook": "post_merge_handler",
        "pr_review": "code_review_handler",
        "branch_protection": "branch_policy_handler",
        "ci_status": "ci_status_handler"
      },
      "feature_flags": {
        "enable_multi_platform": true,
        "enable_ast_analysis": true,
        "enable_ml_scoring": true,
        "enable_observability": true
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-router
  namespace: manta-fase4-prod
  labels:
    app: platform-router
    version: v1.0.0
    component: pillar-a
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: platform-router
  template:
    metadata:
      labels:
        app: platform-router
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: manta-fase4-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: router
        image: manta-fase4/platform-router:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          value: "info"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://jaeger-collector:4317"
        - name: OTEL_SERVICE_NAME
          value: "platform-router"
        volumeMounts:
        - name: config
          mountPath: /etc/router/config
          readOnly: true
        - name: cache
          mountPath: /var/cache/router
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        startupProbe:
          httpGet:
            path: /health/startup
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 1
          timeoutSeconds: 3
          failureThreshold: 30
      volumes:
      - name: config
        configMap:
          name: router-config
      - name: cache
        emptyDir:
          sizeLimit: 512Mi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - platform-router
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: platform-router
  namespace: manta-fase4-prod
  labels:
    app: platform-router
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app: platform-router
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: platform-router-hpa
  namespace: manta-fase4-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: platform-router
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
