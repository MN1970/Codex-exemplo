apiVersion: v1
kind: Service
metadata:
  name: pal-service
  namespace: default
  labels:
    app: pal
    component: service
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  selector:
    app: pal
    component: service

---

apiVersion: v1
kind: Service
metadata:
  name: pal-service-headless
  namespace: default
  labels:
    app: pal
    component: service
spec:
  clusterIP: None
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
  selector:
    app: pal
    component: service

---

# Ingress for external access (optional)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pal-ingress
  namespace: default
  labels:
    app: pal
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - pal.example.com
    secretName: pal-tls-cert
  rules:
  - host: pal.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pal-service
            port:
              number: 80
