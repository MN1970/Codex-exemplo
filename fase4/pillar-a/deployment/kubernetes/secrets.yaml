apiVersion: v1
kind: Secret
metadata:
  name: pal-credentials
  namespace: default
  labels:
    app: pal
type: Opaque
stringData:
  # These values should be provided during deployment
  # kubectl create secret generic pal-credentials \
  #   --from-literal=github-token='YOUR_GITHUB_TOKEN' \
  #   --from-literal=gitlab-token='YOUR_GITLAB_TOKEN' \
  #   --from-literal=bitbucket-token='YOUR_BITBUCKET_TOKEN' \
  #   --from-literal=gitea-token='YOUR_GITEA_TOKEN'
  github-token: ""
  gitlab-token: ""
  bitbucket-token: ""
  gitea-token: ""

---

apiVersion: v1
kind: Secret
metadata:
  name: pal-ca-bundle
  namespace: default
  labels:
    app: pal
type: Opaque
data:
  # Base64 encoded CA certificate bundle
  # kubectl create secret generic pal-ca-bundle \
  #   --from-file=ca-bundle.crt=/path/to/ca-bundle.crt
  ca-bundle.crt: ""

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: pal-service
  namespace: default
  labels:
    app: pal

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pal-reader
  labels:
    app: pal
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["pal-credentials", "pal-ca-bundle"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pal-reader-binding
  labels:
    app: pal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pal-reader
subjects:
- kind: ServiceAccount
  name: pal-service
  namespace: default

---

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pal-pdb
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: pal
      component: service

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pal-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pal-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max
