apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: observability
data:
  config.yml: |
    global:
      resolve_timeout: 5m
      slack_api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
      pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

    route:
      receiver: 'default'
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - match:
            severity: critical
          receiver: pagerduty-critical
          group_wait: 10s
          group_interval: 1m
          repeat_interval: 30m

        - match:
            severity: warning
          receiver: slack-warning
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 2h

        - match:
            severity: info
          receiver: email-info
          group_wait: 1m
          group_interval: 10m
          repeat_interval: 24h

    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'cluster', 'service']

      - source_match:
          severity: 'warning'
        target_match:
          severity: 'info'
        equal: ['alertname', 'cluster', 'service']

    receivers:
      - name: 'default'
        slack_configs:
          - channel: '#manta-observability'
            title: 'Manta Alert'
            text: '{{ range .Alerts }}{{ .Annotations.summary }}: {{ .Annotations.description }}\n{{ end }}'
            send_resolved: true
            color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

      - name: 'pagerduty-critical'
        pagerduty_configs:
          - service_key: '{{ .GroupLabels.service_key }}'
            description: '{{ .GroupLabels.alertname }}: {{ (index .Alerts 0).Annotations.summary }}'
            details:
              firing: '{{ range .Alerts.Firing }}{{ .Annotations.description }}\n{{ end }}'
              resolved: '{{ range .Alerts.Resolved }}{{ .Annotations.description }}\n{{ end }}'

      - name: 'slack-warning'
        slack_configs:
          - channel: '#manta-alerts'
            title: 'Manta Warning'
            text: '{{ range .Alerts }}{{ .Labels.alertname }}: {{ .Annotations.description }}\n{{ end }}'
            send_resolved: true
            color: 'warning'

      - name: 'email-info'
        email_configs:
          - to: 'manta-team@mantaassociados.com'
            from: 'alertmanager@manta.local'
            smarthost: 'smtp.gmail.com:587'
            auth_username: 'alerts@manta.local'
            auth_password: 'EMAIL_PASSWORD_HERE'
            headers:
              Subject: 'Manta Alert: {{ .GroupLabels.alertname }}'
            html: |
              <html>
              <body>
              <h2>{{ .GroupLabels.alertname }}</h2>
              {{ range .Alerts }}
              <p><strong>{{ .Annotations.summary }}</strong></p>
              <p>{{ .Annotations.description }}</p>
              <p>Labels: {{ .Labels }}</p>
              {{ end }}
              </body>
              </html>

    templates: []
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: observability
  labels:
    app: alertmanager
spec:
  type: ClusterIP
  selector:
    app: alertmanager
  ports:
    - name: web
      port: 9093
      targetPort: web
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-nodeport
  namespace: observability
  labels:
    app: alertmanager
spec:
  type: NodePort
  selector:
    app: alertmanager
  ports:
    - name: web
      port: 9093
      targetPort: web
      nodePort: 30093
      protocol: TCP
