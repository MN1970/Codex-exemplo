apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: observability
data:
  grafana.ini: |
    [paths]
    data = /var/lib/grafana
    logs = /var/log/grafana
    plugins = /var/lib/grafana/plugins

    [server]
    root_url = http://grafana:3000
    domain = grafana.manta.local
    enforce_domain = false

    [database]
    type = sqlite3
    path = /var/lib/grafana/grafana.db

    [security]
    admin_user = admin
    cookie_secure = true
    cookie_samesite = lax

    [users]
    allow_sign_up = false
    allow_org_create = false

    [auth]
    signout_redirect_url = /

    [auth.anonymous]
    enabled = true
    org_role = Viewer

    [explore]
    enabled = true

    [metrics]
    enabled = true
    interval_seconds = 60

    [grafana_net]
    url = https://grafana.net

    [log]
    mode = console
    level = info

    [feature_toggles]
    traceToMetrics = true
    metricRelabeling = true
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
  labels:
    app: grafana
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - name: web
      port: 3000
      targetPort: web
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-nodeport
  namespace: observability
  labels:
    app: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: web
      port: 3000
      targetPort: web
      nodePort: 30300
      protocol: TCP
