# Prometheus configuration for Manta Maestro
# Scrapes: FastAPI /metrics, PostgreSQL exporter, Node exporter, Jaeger

global:
  scrape_interval: 15s          # Default scrape interval
  evaluation_interval: 15s       # Default evaluation interval for rules
  external_labels:
    cluster: 'manta-production'
    environment: '${ENVIRONMENT:-development}'
    region: '${REGION:-us-east-1}'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load alerting rules
rule_files:
  - '/etc/prometheus/rules/*.yaml'

scrape_configs:
  # FastAPI application metrics
  - job_name: 'manta-maestro-api'
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: '/metrics'
    scheme: http

    # Service discovery: Kubernetes or static
    static_configs:
      - targets: ['${MANTA_API_HOST:-localhost:8000}']
        labels:
          service: 'maestro-api'
          component: 'backend'

    # Relabel configs for enrichment
    relabel_configs:
      # Add custom labels
      - source_labels: [__address__]
        target_label: instance

      # Scrape metrics from the endpoint
      - source_labels: [__scheme__, __address__, __metrics_path__]
        separator: ';'
        regex: '(.*);(.*);(.*)'
        target_label: __param_target
        replacement: '${1}://${2}${3}'

    # Drop high-cardinality metrics
    metric_relabel_configs:
      # Drop trace_id and span_id to prevent cardinality explosion
      - source_labels: [__name__]
        regex: '.*_total|.*_duration_seconds|.*_requests.*'
        action: keep

      # Rename metrics to match conventions
      - source_labels: [__name__]
        regex: 'http_request_duration_seconds'
        target_label: 'metric_type'
        replacement: 'latency'

  # PostgreSQL exporter metrics
  - job_name: 'postgres-exporter'
    scrape_interval: 30s
    scrape_timeout: 10s
    scheme: http

    static_configs:
      - targets: ['${POSTGRES_EXPORTER_HOST:-localhost:9187}']
        labels:
          service: 'postgres'
          component: 'database'
          database: '${POSTGRES_DB:-manta}'

    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

    metric_relabel_configs:
      # Keep only essential database metrics
      - source_labels: [__name__]
        regex: 'pg_stat_activity_count|pg_connections_total|pg_database_size_bytes|pg_stat_user_tables_n_tup.*|pg_slow_queries|pg_index_bloat_bytes'
        action: keep

  # Node exporter (system metrics)
  - job_name: 'node-exporter'
    scrape_interval: 30s
    scrape_timeout: 10s
    scheme: http

    static_configs:
      - targets: ['${NODE_EXPORTER_HOST:-localhost:9100}']
        labels:
          service: 'node'
          component: 'infrastructure'
          hostname: '${HOSTNAME:-manta-prod}'

    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

    metric_relabel_configs:
      # Keep essential system metrics only
      - source_labels: [__name__]
        regex: 'node_cpu_seconds_total|node_memory_MemAvailable_bytes|node_memory_MemTotal_bytes|node_disk_read_bytes_total|node_disk_write_bytes_total|node_disk_io_time_seconds_total|node_network_receive_bytes_total|node_network_transmit_bytes_total|node_load1|node_load5|node_load15|node_filesystem_avail_bytes|node_filesystem_size_bytes'
        action: keep

  # Jaeger metrics (optional: if Jaeger exposes metrics)
  - job_name: 'jaeger'
    scrape_interval: 30s
    scrape_timeout: 10s
    scheme: http

    static_configs:
      - targets: ['${JAEGER_METRICS_HOST:-localhost:14269}']
        labels:
          service: 'jaeger'
          component: 'tracing'

    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'jaeger_tracer_traces_.*|jaeger_tracer_spans_.*|jaeger_sampler_updated|jaeger_sampler_.*'
        action: keep

