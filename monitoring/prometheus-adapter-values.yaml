# Prometheus Adapter Helm Values
# Maps Prometheus metrics to Kubernetes custom metrics API

prometheus:
  url: http://kube-prometheus-stack-prometheus.monitoring
  port: 9090

rules:
  # Resource rules for CPU and memory
  custom:
    # FastAPI request per second custom metric
    - seriesQuery: 'manta_api_requests_per_second{<<.LabelMatchers>>}'
      seriesFilters: []
      resources:
        overrides:
          namespace: {resource: "namespace"}
          pod: {resource: "pod"}
          instance: {resource: "pod"}
      name:
        matches: "^manta_api_requests_per_second"
        as: "requests_per_second"
      metricsQuery: 'manta_api_requests_per_second{<<.LabelMatchers>>}'

    # Semantic search latency p95 metric
    - seriesQuery: 'manta_semantic_search_latency_p95{<<.LabelMatchers>>}'
      seriesFilters: []
      resources:
        overrides:
          namespace: {resource: "namespace"}
          pod: {resource: "pod"}
      name:
        matches: "^manta_semantic_search_latency_p95"
        as: "search_latency_p95"
      metricsQuery: 'manta_semantic_search_latency_p95{<<.LabelMatchers>>}'

    # Model inference queue depth metric
    - seriesQuery: 'manta_model_inference_queue_depth{<<.LabelMatchers>>}'
      seriesFilters: []
      resources:
        overrides:
          namespace: {resource: "namespace"}
          pod: {resource: "pod"}
      name:
        matches: "^manta_model_inference_queue_depth"
        as: "model_queue_depth"
      metricsQuery: 'manta_model_inference_queue_depth{<<.LabelMatchers>>}'

    # Database active connections metric
    - seriesQuery: 'pg_stat_activity_count{state="active",<<.LabelMatchers>>}'
      seriesFilters: []
      resources:
        overrides:
          namespace: {resource: "namespace"}
          pod: {resource: "pod"}
      name:
        matches: "^pg_stat_activity_count"
        as: "db_active_connections"
      metricsQuery: 'pg_stat_activity_count{state="active",<<.LabelMatchers>>}'

  external: []
  # External metrics for workload-wide scaling (not pod-specific)
  # - seriesQuery: 'up{job="prometheus"}'
  #   resources:
  #     template: <<.Resource>>
  #   name:
  #     matches: "^(.*)_total$"
  #     as: "${1}"
  #   metricsQuery: '<<.Series>>{<<.LabelMatchers>>}'

  resource:
    overrides:
      # Node-level resource metrics
      node: {resource: "node"}
      namespace: {resource: "namespace"}
      # Pod-level resource metrics
      pod: {resource: "pod"}
      container: {resource: "container"}

# CPU metrics
cpu:
  containerQuery: 'sum(rate(container_cpu_usage_seconds_total[1m])) by (<<.LabelMatchers>>)'
  nodeQuery: 'sum(rate(node_cpu_seconds_total{mode!="idle"}[1m])) by (<<.LabelMatchers>>)'
  resources:
    overrides:
      node: {resource: "node"}
      namespace: {resource: "namespace"}
      pod: {resource: "pod"}
      container: {resource: "container"}
  containerLabel: container
  nodeLabel: node
  resources:
    overrides:
      instance: {resource: "node"}
      namespace: {resource: "namespace"}
      pod: {resource: "pod"}
  window: 1m

# Memory metrics
memory:
  containerQuery: 'sum(container_memory_working_set_bytes) by (<<.LabelMatchers>>)'
  nodeQuery: 'sum(node_memory_MemAvailable_bytes) by (<<.LabelMatchers>>)'
  resources:
    overrides:
      node: {resource: "node"}
      namespace: {resource: "namespace"}
      pod: {resource: "pod"}
      container: {resource: "container"}
  containerLabel: container
  nodeLabel: node
  resources:
    overrides:
      instance: {resource: "node"}
      namespace: {resource: "namespace"}
      pod: {resource: "pod"}
  window: 1m

# Deployment configuration
replicas: 2

image:
  repository: registry.k8s.io/prometheus-adapter/prometheus-adapter
  tag: v0.11.0

resources:
  limits:
    cpu: 250m
    memory: 200Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Service account
serviceAccount:
  create: true
  name: prometheus-adapter

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# Affinity rules
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - prometheus-adapter
          topologyKey: kubernetes.io/hostname

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Labels
labels:
  app.kubernetes.io/name: prometheus-adapter
  app.kubernetes.io/component: monitoring
