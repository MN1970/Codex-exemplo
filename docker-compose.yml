version: '3.8'

services:
  # ============================================================================
  # FastAPI Backend Service
  # ============================================================================
  backend:
    build:
      context: ./manta-backend
      dockerfile: Dockerfile
    container_name: manta-backend
    environment:
      # Application
      ENVIRONMENT: development
      DEBUG: "true"
      HOST: 0.0.0.0
      PORT: 8000

      # Database (PostgreSQL in docker-compose)
      DATABASE_URL: postgresql://manta:mantadev@db:5432/manta

      # CORS
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://localhost:8000"]'

      # Auth (RS256)
      JWT_ALGORITHM: RS256
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_ISSUER: manta-maestro-auth
      ACCESS_TOKEN_EXPIRES_MINUTES: 15
      REFRESH_TOKEN_EXPIRES_DAYS: 30
      ORG_HEADER_NAME: X-Org-Id
      JWT_SECRET: change-me-in-production

      # Legacy Auth
      JWT_EXPIRES_MINUTES: 480

      # MCP Gateway
      MCP_GATEWAY_URL: ${MCP_GATEWAY_URL:-http://mcp-gateway:8765}
      MCP_REQUEST_TIMEOUT_SECONDS: 30

      # MCP Remote (Multi-server)
      GITHUB_MCP_URL: ${GITHUB_MCP_URL:-}
      GITHUB_MCP_TOKEN: ${GITHUB_MCP_TOKEN:-}
      SUPABASE_MCP_URL: ${SUPABASE_MCP_URL:-}
      SUPABASE_MCP_TOKEN: ${SUPABASE_MCP_TOKEN:-}
      MICROSOFT_365_MCP_URL: ${MICROSOFT_365_MCP_URL:-}
      MICROSOFT_365_MCP_TOKEN: ${MICROSOFT_365_MCP_TOKEN:-}

      # Claude API (Agent Executor)
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      CLAUDE_DEFAULT_MODEL: claude-3-5-sonnet-20241022
      CLAUDE_OPUS_MODEL: claude-3-opus-20250219
      CLAUDE_MAX_TOKENS: 4096
      CLAUDE_STREAMING_TIMEOUT: 120

      # Embeddings (Sentence Transformers local)
      EMBEDDING_MODEL: all-MiniLM-L6-v2
      EMBEDDING_DIMENSIONS: 384

      # Redis for caching/sessions
      REDIS_URL: redis://redis:6379/0

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Workers (Uvicorn)
      WORKERS: ${API_WORKERS:-2}
    ports:
      - "8000:8000"
    expose:
      - 8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Code mount for hot-reload
      - ./manta-backend:/app
      # Cache for Python packages
      - backend-cache:/home/root/.cache
    networks:
      - manta-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    command: >
      uvicorn app:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dirs /app
      --workers 2
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  # ============================================================================
  # PostgreSQL 15 with pgvector
  # ============================================================================
  db:
    image: pgvector/pgvector:pg16-latest
    container_name: manta-postgres
    environment:
      POSTGRES_USER: manta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mantadev}
      POSTGRES_DB: manta
      POSTGRES_INITDB_ARGS: >
        -c log_statement=all
        -c log_min_duration_statement=1000
        -c shared_preload_libraries=pgvector
    ports:
      - "5432:5432"
    expose:
      - 5432
    volumes:
      # Database persistence
      - manta-db-data:/var/lib/postgresql/data
      # Initialization script (if exists)
      - ./manta-backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # Logs (optional)
      - manta-db-logs:/var/log/postgresql
    networks:
      - manta-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manta -d manta"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 1G

  # ============================================================================
  # Redis for Caching & Sessions
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: manta-redis
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --save 60 1000
    ports:
      - "6379:6379"
    expose:
      - 6379
    volumes:
      # Persistence
      - manta-redis-data:/data
    networks:
      - manta-network
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  # ============================================================================
  # React Frontend (Vite Dev Server)
  # ============================================================================
  frontend:
    build:
      context: ./manta-frontend
      dockerfile: Dockerfile.dev
      target: dev
    container_name: manta-frontend
    environment:
      # Frontend API endpoint
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_API_TIMEOUT: ${VITE_API_TIMEOUT:-30000}
      VITE_AUTH_ENABLED: ${VITE_AUTH_ENABLED:-true}
      VITE_LOG_LEVEL: ${VITE_LOG_LEVEL:-info}
      # Vite HMR config (Hot Module Replacement)
      HOST: 0.0.0.0
      VITE_HMR_HOST: localhost
      VITE_HMR_PORT: 5173
      VITE_HMR_PROTOCOL: ws
    ports:
      - "5173:5173"
    expose:
      - 5173
    volumes:
      # Code mount for hot-reload
      - ./manta-frontend:/app
      # Exclude node_modules from sync
      - /app/node_modules
      # Cache for node packages
      - frontend-cache:/app/node_modules/.cache
    networks:
      - manta-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    command: npm run dev
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

volumes:
  # PostgreSQL persistent data
  manta-db-data:
    driver: local
  # PostgreSQL logs
  manta-db-logs:
    driver: local
  # Redis persistent data
  manta-redis-data:
    driver: local
  # Backend Python cache
  backend-cache:
    driver: local
  # Frontend node_modules cache
  frontend-cache:
    driver: local

networks:
  # Internal network for service-to-service communication
  manta-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
