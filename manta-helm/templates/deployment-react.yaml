{{- if .Values.react.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "manta.fullname" . }}-react
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "manta.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
spec:
  replicas: {{ .Values.react.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "manta.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web

  template:
    metadata:
      labels:
        {{- include "manta.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        {{- if .Values.commonAnnotations }}
        {{- toYaml .Values.commonAnnotations | nindent 8 }}
        {{- end }}

    spec:
      {{- if .Values.react.securityContext }}
      securityContext:
        {{- toYaml .Values.react.securityContext | nindent 8 }}
      {{- end }}

      serviceAccountName: {{ .Values.rbac.serviceAccounts.react.name }}
      automountServiceAccountToken: false

      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}

      {{- if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}

      containers:
        - name: react
          image: "{{ .Values.react.image.repository }}:{{ .Values.react.image.tag }}"
          imagePullPolicy: {{ .Values.react.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.react.service.targetPort }}
              protocol: TCP

          {{- if .Values.react.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.react.livenessProbe | nindent 12 }}
          {{- end }}

          {{- if .Values.react.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.react.readinessProbe | nindent 12 }}
          {{- end }}

          resources:
            {{- toYaml .Values.react.resources | nindent 12 }}

          env:
            {{- range $key, $value := .Values.react.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            # Pod metadata for debugging
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

          volumeMounts:
            # Nginx configuration with reverse proxy
            {{- if .Values.react.nginxConfig.enabled }}
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            {{- end }}
            # Temporary directories for Nginx
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-var-run
              mountPath: /var/run

          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            fsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

      volumes:
        {{- if .Values.react.nginxConfig.enabled }}
        # Nginx configuration
        - name: nginx-config
          configMap:
            name: {{ .Values.react.nginxConfig.configMapName }}
            defaultMode: 0644
        {{- end }}
        # Nginx cache (emptyDir)
        - name: nginx-cache
          emptyDir: {}
        # Nginx /var/run (emptyDir)
        - name: nginx-var-run
          emptyDir: {}

      # Graceful shutdown
      terminationGracePeriodSeconds: 30

---
# Horizontal Pod Autoscaler for React SPA
{{- if .Values.autoscaling.react.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "manta.fullname" . }}-react
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "manta.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "manta.fullname" . }}-react
  minReplicas: {{ .Values.autoscaling.react.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.react.maxReplicas }}
  metrics:
    {{- if .Values.autoscaling.react.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.react.targetCPUUtilizationPercentage }}
    {{- end }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
      selectPolicy: Max
{{- end }}
{{- end }}
