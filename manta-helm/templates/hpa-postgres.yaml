{{- if .Values.autoscaling.postgres.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "manta.fullname" . }}-postgres
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "manta.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: {{ include "manta.fullname" . }}-postgres
  minReplicas: {{ .Values.autoscaling.postgres.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.postgres.maxReplicas }}
  metrics:
    {{- if .Values.autoscaling.postgres.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.postgres.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.autoscaling.postgres.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.postgres.targetMemoryUtilizationPercentage }}
    {{- end }}
    {{- if .Values.autoscaling.postgres.customMetrics }}
    # Custom metric: pg_stat_activity for active connections
    {{- range .Values.autoscaling.postgres.customMetrics }}
    - type: Pods
      pods:
        metric:
          name: {{ .name }}
        target:
          type: {{ .targetType }}
          averageValue: {{ .targetValue }}
    {{- end }}
    {{- end }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Max
{{- end }}
