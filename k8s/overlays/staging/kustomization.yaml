apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: maestro-staging

namePrefix: maestro-staging-
commonSuffix: ""

bases:
  - ../../base

patchesStrategicMerge:
  - deployment.yaml

replicas:
  - name: maestro
    count: 2

configMapGenerator:
  - name: maestro-config
    literals:
      - ENVIRONMENT=staging
      - LOG_LEVEL=debug
      - REPLICA_COUNT=2

secretGenerator:
  - name: maestro-secrets
    envs:
      - secrets.env

resources:
  - namespace.yaml
  - service.yaml
  - configmap.yaml
  - secret.yaml
  - ingress.yaml

vars:
  - name: MAESTRO_VERSION
    objref:
      kind: ConfigMap
      name: maestro-config
      apiVersion: v1
    fieldref:
      fieldpath: data.version
