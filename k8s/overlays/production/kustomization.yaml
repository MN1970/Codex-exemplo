apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: maestro-production

namePrefix: maestro-
commonSuffix: ""

bases:
  - ../../base

patchesStrategicMerge:
  - deployment.yaml

replicas:
  - name: maestro
    count: 3

configMapGenerator:
  - name: maestro-config
    literals:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - REPLICA_COUNT=3
      - SENTRY_ENABLED=true
      - RATE_LIMIT_ENABLED=true

secretGenerator:
  - name: maestro-secrets
    envs:
      - secrets.env

resources:
  - namespace.yaml
  - service.yaml
  - configmap.yaml
  - secret.yaml
  - ingress.yaml
  - network-policy.yaml
  - pod-disruption-budget.yaml

vars:
  - name: MAESTRO_VERSION
    objref:
      kind: ConfigMap
      name: maestro-config
      apiVersion: v1
    fieldref:
      fieldpath: data.version
