[pytest]
testpaths = tests
python_files = test_*.py
markers =
    unit: testes unitários — schema/consistência, sem rede, sem secrets.
    smoke: smoke tests — chamam a API Anthropic de verdade (precisam de ANTHROPIC_API_KEY).
    rag: testes de consistência e verificação live das coleções RAG/Supabase.
addopts = -ra --strict-markers
