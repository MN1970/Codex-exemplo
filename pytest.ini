[pytest]
# Maestro E2E Test Configuration (v5.0)

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers
markers =
    ci: CI/CD gate tests (fast, regression-focused)
    perf: Performance baseline tests (slower)
    integration: Integration tests (cross-agent flows)
    smoke: Smoke tests (quick validation)

# Output configuration
console_output_style = progress
addopts =
    --strict-markers
    --disable-warnings
    -ra

# Timeout (seconds)
timeout = 300
timeout_method = thread

# Coverage configuration
[coverage:run]
source = tests
omit =
    */site-packages/*
    */venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
precision = 2
skip_covered = False

[coverage:html]
directory = htmlcov

# Log configuration
log_cli = false
log_cli_level = INFO
log_file = tests/pytest.log
log_file_level = DEBUG
log_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
