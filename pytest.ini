[pytest]
testpaths = tests
python_files = test_*.py
markers =
    unit: testes unitários — schema/consistência, sem rede, sem secrets.
    smoke: smoke tests — chamam a API Anthropic de verdade (precisam de ANTHROPIC_API_KEY).
    rag: testes de consistência e verificação live das coleções RAG/Supabase.
    integration: testes de integração entre múltiplos componentes (ex: cross-agent flows), sem chamada real à API Anthropic.
    ci: testes de regressão específicos de CI (ex: nodeid contém "regression").
    perf: testes de performance/benchmark (ex: nodeid contém "performance").
addopts = -ra --strict-markers
