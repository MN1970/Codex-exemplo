[pytest]
testpaths = tests
python_files = test_*.py
markers =
    unit: testes unitários — schema/consistência, sem rede, sem secrets.
    smoke: smoke tests — chamam a API Anthropic de verdade (precisam de ANTHROPIC_API_KEY).
    rag: testes de consistência e verificação live das coleções RAG/Supabase.
    ci: CI/CD gate tests (regression suite only).
    perf: performance baseline tests.
    integration: integration tests.
    asyncio: async test coroutines (executed manually via asyncio.run, sem plugin pytest-asyncio).
addopts = -ra --strict-markers
